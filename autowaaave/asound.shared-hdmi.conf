# Share the HiFiBerry stereo input between the renderer's optional Pi FFT
# fallback and the clean audio loop sent to HDMI.
pcm.hifiberry {
    type hw
    card "sndrpihifiberry"
    device 0
}

pcm.shared_hifiberry {
    type dsnoop
    ipc_key 662522
    ipc_key_add_uid true
    slave {
        pcm "hifiberry"
        format S32_LE
        channels 2
        rate 44100
        period_size 256
        buffer_size 8192
    }
}

pcm.!default {
    type plug
    slave.pcm "shared_hifiberry"
}

# Playback-only software gain for the clean HDMI passthrough. The HiFiBerry
# capture and FFT paths still receive untouched input audio.
pcm.autoeyez_hdmi_volume {
    type softvol
    slave.pcm "hdmi:CARD=vc4hdmi0,DEV=0"
    control {
        name "Autoeyez HDMI Volume"
        card "vc4hdmi0"
    }
    min_dB -50.0
    max_dB 6.0
    resolution 128
}
